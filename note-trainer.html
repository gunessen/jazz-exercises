<title>Find the Note</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Music&text=%E2%99%AD%E2%99%AF%F0%9D%84%9E%F0%9D%84%A2&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  html, body { height: 100%; }

  .app {
    min-height: 100%; display: flex; flex-direction: column; gap: 18px;
    padding: 18px 20px 22px; max-width: 1140px; margin: 0 auto;
  }

  /* ---- stage ---- */
  .stage { display: grid; grid-template-columns: minmax(0,1fr) 210px; gap: 18px; align-items: stretch; }
  .prompt {
    position: relative; background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; box-shadow: var(--shadow); padding: 22px 26px 24px;
    display: flex; flex-direction: column; gap: 4px; min-height: 260px; overflow: hidden;
  }
  .prompt[data-verdict="right"] { border-color: var(--good); background: var(--good-wash); }
  .prompt[data-verdict="wrong"] { border-color: var(--miss); background: var(--miss-wash); }
  .prompt-main { display: flex; align-items: center; gap: 14px 26px; flex-wrap: wrap; }
  .prompt-text { flex: 1 1 200px; min-width: 0; }

  /* ---- staff ---- */
  .staff { flex: 0 1 310px; width: 310px; max-width: 100%; height: auto; }
  .staff .stave line { stroke: var(--muted); stroke-width: 1; opacity: .5; }
  .staff .led { stroke: var(--muted); stroke-width: 1.3; opacity: .85; }
  .staff .clef { fill: var(--ink); opacity: .8; font-family: "Noto Music", serif; }
  .staff .clef-label { fill: var(--muted); font-family: var(--f-mono); font-size: 8.5px; letter-spacing: .1em; }
  .staff .nh { fill: var(--brass); }
  .staff .nh.right { fill: var(--good); }
  .staff .nh.wrong { fill: var(--miss); }
  .staff .nh.ghost { fill: none; stroke: var(--good); stroke-width: 1.6; }
  .staff .acc { fill: var(--brass); font-family: "Noto Music", var(--f-body); font-size: 16px; text-anchor: end; }
  .staff .acc.right { fill: var(--good); }
  .staff .acc.wrong { fill: var(--miss); }
  .staff .acc.ghost { fill: var(--good); }

  /* ---- the asked note ---- */
  .root {
    font-family: var(--f-display); font-weight: 700;
    font-size: clamp(76px, 16vw, 148px); line-height: 1; letter-spacing: -.04em;
    margin: 2px 0 4px; display: flex; align-items: baseline; gap: .04em;
  }
  .root .acc { font-size: .68em; letter-spacing: 0; }
  .root .oct { font-family: var(--f-mono); font-size: .2em; color: var(--muted); letter-spacing: .02em; }
  .sub { font-size: clamp(15px, 2.6vw, 19px); color: var(--muted); margin: 0; text-wrap: balance; }
  .sub em { font-style: normal; color: var(--brass); }

  .played {
    margin-top: auto; padding-top: 14px; display: flex; align-items: center; gap: 10px;
    font-family: var(--f-mono); font-size: 13.5px; min-height: 34px; flex-wrap: wrap;
  }
  .chip-note {
    display: inline-block; min-width: 46px; text-align: center; padding: 3px 9px;
    border: 1px solid var(--line); border-radius: 4px; background: var(--ground);
  }
  .verdict { font-weight: 600; letter-spacing: .02em; }
  .verdict[data-v="right"] { color: var(--good); }
  .verdict[data-v="wrong"] { color: var(--miss); }
  .hint { color: var(--muted); font-family: var(--f-body); font-size: 13px; }
  .count { margin-left: auto; color: var(--muted); font-size: 12px; letter-spacing: .02em; white-space: nowrap; }
  .pace { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; }
  .pace i { display: block; height: 100%; width: 100%; background: var(--muted); }
  .prompt[data-verdict="right"] .pace i { background: var(--good); }
  .prompt[data-verdict="wrong"] .pace i { background: var(--miss); }

  /* ---- stats ---- */
  .stats { display: flex; flex-direction: column; gap: 0; padding-top: 4px; }
  .stat { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .stat:first-child { border-top: 1px solid var(--line); }
  .stat dt { font-size: 12.5px; color: var(--muted); }
  .stat dd { margin: 0; font-family: var(--f-mono); font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat.lead dd { font-size: 24px; }
  .stat-actions { display: flex; gap: 14px; padding-top: 12px; }

  /* ---- keyboard ---- */
  .kb-wrap { background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 10px 10px 12px; }
  .kb { position: relative; height: 150px; width: 100%; user-select: none; touch-action: none; }
  .kb .w, .kb .b { position: absolute; top: 0; border: 0; padding: 0; cursor: pointer; }
  .kb .w {
    background: var(--key-white); border: 1px solid var(--key-white-edge); border-top: 0;
    border-radius: 0 0 4px 4px; height: 100%;
    display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px;
    font-family: var(--f-mono); font-size: 10px; color: #8A8F86;
  }
  .kb .b {
    background: var(--key-black); border-radius: 0 0 3px 3px; height: 62%; z-index: 2;
    box-shadow: 0 2px 4px rgba(0,0,0,.35);
  }
  .kb .w.held { background: var(--brass); border-color: var(--brass); color: rgba(0,0,0,.45); }
  .kb .b.held { background: var(--brass); }
  .kb .w.right, .kb .b.right { background: var(--good); border-color: var(--good); }
  .kb .w.wrong, .kb .b.wrong { background: var(--miss); border-color: var(--miss); }
  .kb .w.ghost { box-shadow: inset 0 -6px 0 -1px var(--good); }
  .kb .b.ghost { box-shadow: inset 0 -6px 0 -1px var(--good), 0 2px 4px rgba(0,0,0,.35); }
  .kb-legend { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }

  /* ---- settings ---- */
  .settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px 26px; border-top: 1px solid var(--line); padding-top: 16px; }
  .settings .label { margin-bottom: 8px; }

  @media (max-height: 640px) and (orientation: landscape) {
    .app { gap: 10px; padding: 10px 16px 12px; }
    .prompt { min-height: 0; padding: 14px 18px 15px; }
    .root { font-size: clamp(48px, 13vh, 96px); margin: 0; }
    .staff { flex-basis: 230px; width: 230px; }
    .prompt-main { gap: 10px 18px; }
    .sub { font-size: clamp(13px, 2.8vh, 17px); }
    .played { padding-top: 9px; min-height: 0; }
    .kb { height: clamp(86px, 24vh, 132px); }
    .kb-wrap { padding: 8px 8px 9px; }
    .kb-legend { margin-top: 5px; }
    .stat { padding: 5px 0; }
    .stat.lead dd { font-size: 20px; }
    .settings { padding-top: 11px; gap: 11px 22px; }
  }
  @media (max-width: 760px) {
    .stage { grid-template-columns: 1fr; }
    .kb { height: 118px; }
    .app { padding: 14px 16px 18px; }
  }
</style>

<div class="app">
  <header class="bar">
    <h1 class="wordmark"><a href="index.html">Jazz Exercises</a> · Find the <em>Note</em></h1>
    <div class="bar-right">
      <span class="status" id="status" data-on="wait"><span class="dot"></span><span id="statusText">connecting</span></span>
      <select class="device" id="device" aria-label="MIDI input"><option>No MIDI input</option></select>
      <button class="chip" id="fs" type="button" aria-pressed="false" hidden>Fullscreen</button>
    </div>
  </header>

  <div class="notice" id="notice" hidden></div>

  <main class="stage">
    <section class="prompt" id="prompt" data-verdict="none" aria-live="polite">
      <div class="prompt-main">
        <div class="prompt-text">
          <p class="label" id="counter">Prompt 1</p>
          <div class="root" id="askNote"><span>C</span><span class="oct">4</span></div>
          <p class="sub" id="sub">Play it — one key, no thinking.</p>
        </div>
        <svg class="staff" id="staff" viewBox="0 0 210 150" aria-hidden="true">
          <g class="stave">
            <line x1="8" y1="25" x2="202" y2="25"/><line x1="8" y1="35" x2="202" y2="35"/>
            <line x1="8" y1="45" x2="202" y2="45"/><line x1="8" y1="55" x2="202" y2="55"/>
            <line x1="8" y1="65" x2="202" y2="65"/>
            <line x1="8" y1="85" x2="202" y2="85"/><line x1="8" y1="95" x2="202" y2="95"/>
            <line x1="8" y1="105" x2="202" y2="105"/><line x1="8" y1="115" x2="202" y2="115"/>
            <line x1="8" y1="125" x2="202" y2="125"/>
            <line x1="8" y1="25" x2="8" y2="125"/>
          </g>
          <g id="clefs"><text class="clef" x="16" y="55" font-size="40">&#119070;</text><text class="clef" x="16" y="95" font-size="40">&#119074;</text></g>
          <g id="staffNotes"></g>
        </svg>
      </div>
      <div class="played">
        <span class="chip-note" id="slot1">&middot;</span>
        <span class="verdict" id="verdict"></span>
        <span class="hint" id="hint"></span>
        <span class="count" id="count" aria-hidden="true" hidden></span>
      </div>
      <div class="pace" id="pace" aria-hidden="true" hidden><i id="paceBar"></i></div>
    </section>

    <dl class="stats">
      <div class="stat lead"><dt>Score</dt><dd id="sScore">0/0</dd></div>
      <div class="stat"><dt>Streak</dt><dd id="sStreak">0</dd></div>
      <div class="stat"><dt>Best streak</dt><dd id="sBest">0</dd></div>
      <div class="stat"><dt>Accuracy</dt><dd id="sAcc">&mdash;</dd></div>
      <div class="stat"><dt>Median time</dt><dd id="sTime">&mdash;</dd></div>
      <div class="stat-actions">
        <button class="link-btn" id="show">Show answer</button>
        <button class="link-btn" id="skip">Skip &rarr;</button>
        <button class="link-btn" id="reset">Reset score</button>
      </div>
    </dl>
  </main>

  <div class="kb-wrap">
    <div class="kb" id="kb"></div>
    <div class="kb-legend">
      <span id="kbRange">C3 &mdash; B5 &middot; click or play</span>
      <span id="kbHint">one key ends the prompt</span>
    </div>
  </div>

  <footer class="settings">
    <div>
      <p class="label">Notes in the pool</p>
      <div class="chips" id="poolChips">
        <button class="chip" data-group="nat" type="button">Naturals</button>
        <button class="chip" data-group="sharp" type="button">Sharps &#9839;</button>
        <button class="chip" data-group="flat" type="button">Flats &#9837;</button>
      </div>
    </div>
    <div>
      <p class="label">Octaves</p>
      <div class="chips" id="octChips">
        <button class="chip" data-oct="1" type="button">1 &middot; C4</button>
        <button class="chip" data-oct="2" type="button">2 &middot; C3&ndash;B4</button>
        <button class="chip" data-oct="3" type="button">3 &middot; C3&ndash;B5</button>
      </div>
    </div>
    <div>
      <p class="label">After a miss</p>
      <div class="chips" id="paceChips">
        <button class="chip" data-pace="2000" type="button">2s</button>
        <button class="chip" data-pace="3000" type="button">3s</button>
        <button class="chip" data-pace="5000" type="button">5s</button>
        <button class="chip" data-pace="8000" type="button">8s</button>
        <button class="chip" data-pace="0" type="button">Manual</button>
      </div>
    </div>
    <div>
      <p class="label">Grading</p>
      <div class="chips" id="gradeChips">
        <button class="chip" data-grade="exact" type="button">Exact octave</button>
        <button class="chip" data-grade="any" type="button">Any octave</button>
        <button class="chip" id="soundChip" type="button">Sound</button>
      </div>
    </div>
  </footer>
</div>

<script>
(function () {
  "use strict";

  /* ---------- music theory ---------- */
  var LET = ["C","D","E","F","G","A","B"];
  var LETSEMI = [0,2,4,5,7,9,11];
  var GROUPS = {
    nat:   [{l:0,a:0},{l:1,a:0},{l:2,a:0},{l:3,a:0},{l:4,a:0},{l:5,a:0},{l:6,a:0}],
    sharp: [{l:0,a:1},{l:1,a:1},{l:3,a:1},{l:4,a:1},{l:5,a:1}],
    flat:  [{l:1,a:-1},{l:2,a:-1},{l:4,a:-1},{l:5,a:-1},{l:6,a:-1}]
  };
  var OCT_SETS = { 1: [4], 2: [3,4], 3: [3,4,5] };

  function acc(n) { return n === 0 ? "" : n > 0 ? "♯".repeat(n) : "♭".repeat(-n); }
  function absOf(l, a, oct) { return 12 * (oct + 1) + LETSEMI[l] + a; }
  function label(n) { return LET[n.l] + acc(n.a); }
  function labelHTML(n) {
    return "<span>" + LET[n.l] + "</span>" + (n.a ? "<span class=\"acc\">" + acc(n.a) + "</span>" : "");
  }
  var SHARP = ["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
  var FLAT  = ["C","D♭","D","E♭","E","F","G♭","G","A♭","A","B♭","B"];
  function midiName(m, flat) {
    return (flat ? FLAT : SHARP)[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);
  }

  /* ---------- state ---------- */
  var groups = ["nat", "sharp", "flat"];
  var octaves = 2, grade = "exact", sound = true;
  var pace = 3000, RIGHT_WAIT = 500, paceTimer = null;
  var revealed = false, locked = false, cur = null, answer = null, retry = null;
  var held = {}, verdict = null;
  var stats = { asked: 0, right: 0, streak: 0, best: 0, times: [] };

  var $ = function (id) { return document.getElementById(id); };
  var kb = $("kb"), keyEls = {};
  var kbLo = 48, kbHi = 71;

  /* ---------- range ---------- */
  // The pool is whole octaves of C; the keys drawn are exactly that universe,
  // so every note you are asked for is on screen and nothing else is.
  function setRange() {
    var o = OCT_SETS[octaves];
    kbLo = 12 * (o[0] + 1);
    kbHi = 12 * (o[o.length - 1] + 1) + 11;
    drawKeys();
  }

  /* ---------- keyboard drawing ---------- */
  function drawKeys() {
    kb.innerHTML = ""; keyEls = {}; held = {};
    var whitePcs = [0,2,4,5,7,9,11], whites = [], m;
    for (m = kbLo; m <= kbHi; m++) if (whitePcs.indexOf(((m % 12) + 12) % 12) >= 0) whites.push(m);
    var w = 100 / whites.length;
    whites.forEach(function (m, i) {
      var b = document.createElement("button");
      b.className = "w"; b.dataset.note = m; b.type = "button";
      b.style.left = (i * w) + "%"; b.style.width = w + "%";
      b.setAttribute("aria-label", midiName(m, false));
      if (m % 12 === 0) b.textContent = "C" + (Math.floor(m / 12) - 1);
      kb.appendChild(b); keyEls[m] = b;
      var pc = (m + 1) % 12;
      if ([1,3,6,8,10].indexOf(pc) >= 0 && m + 1 <= kbHi) {
        var k = document.createElement("button");
        k.className = "b"; k.dataset.note = m + 1; k.type = "button";
        k.style.left = "calc(" + ((i + 1) * w) + "% - " + (w * 0.29) + "%)";
        k.style.width = (w * 0.58) + "%";
        k.setAttribute("aria-label", midiName(m + 1, false));
        kb.appendChild(k); keyEls[m + 1] = k;
      }
    });
    $("kbRange").textContent = midiName(kbLo, false) + " — " + midiName(kbHi, false) + " · click or play";
    fitStaff();
  }

  function paint() {
    for (var m in keyEls) {
      var el = keyEls[m], n = +m;
      el.classList.toggle("held", !!held[n] && !locked);
      el.classList.remove("right", "wrong", "ghost");
    }
    if (verdict && answer !== null && keyEls[lastPlayed]) keyEls[lastPlayed].classList.add(verdict);
    if (revealed && cur && keyEls[cur.abs]) keyEls[cur.abs].classList.add("ghost");
    renderStaff();
  }

  /* ---------- staff ---------- */
  var SPELL_SHARP = [[0,0],[0,1],[1,0],[1,1],[2,0],[3,0],[3,1],[4,0],[4,1],[5,0],[5,1],[6,0]];
  var SPELL_FLAT  = [[0,0],[1,-1],[1,0],[2,-1],[2,0],[3,0],[4,-1],[4,0],[5,-1],[5,0],[6,-1],[6,0]];
  var NX = 116, GX = 170, DX = 13;

  function stepOf(m, flat) {
    var pc = ((m % 12) + 12) % 12, sp = (flat ? SPELL_FLAT : SPELL_SHARP)[pc];
    return { step: (Math.floor(m / 12) - 1) * 7 + sp[0], a: sp[1] };
  }
  function yOf(step) { return 75 - (step - 28) * 5; }        // one diatonic step = half a space
  // The drawn range moves with the octave setting, so the box grows to keep
  // the ledger lines of the outer notes inside it.
  function fitStaff() {
    var ys = [];
    [kbLo, kbHi].forEach(function (m) {
      ys.push(yOf(stepOf(m, false).step));
      ys.push(yOf(stepOf(m, true).step));
    });
    var top = Math.min(0, Math.min.apply(null, ys) - 16);
    var bot = Math.max(150, Math.max.apply(null, ys) + 16);
    $("staff").setAttribute("viewBox", "0 " + top + " 210 " + (bot - top));
  }
  function ledger(x, y) { return '<line class="led" x1="' + (x - 11) + '" y1="' + y + '" x2="' + (x + 11) + '" y2="' + y + '"/>'; }
  function ledgersFor(x, y) {
    var out = "", yl;
    for (yl = 15; yl >= y - 1; yl -= 10) out += ledger(x, yl);      // above the treble staff
    for (yl = 135; yl <= y + 1; yl += 10) out += ledger(x, yl);     // below the bass staff
    if (y === 75) out += ledger(x, y);                              // middle C
    return out;
  }
  function head(x, y, cls) {
    return '<ellipse class="nh ' + cls + '" cx="' + x + '" cy="' + y + '" rx="6.2" ry="4.6" transform="rotate(-18 ' + x + ' ' + y + ')"/>';
  }
  function chord(notes, baseX, clsOf, flat) {
    var out = "", placed = [], prev = null;
    notes.map(function (n) {
      var sp = stepOf(n, flat);
      return { midi: n, step: sp.step, a: sp.a, y: yOf(sp.step) };
    }).sort(function (a, b) { return a.step - b.step; }).forEach(function (o) {
      var cls = clsOf(o.midi);
      o.off = (prev && o.step - prev.step <= 1 && !prev.off) ? 1 : 0;   // seconds sit side by side
      prev = o;
      var x = baseX + o.off * DX;
      out += ledgersFor(x, o.y) + head(x, o.y, cls);
      if (o.a) {
        var ax = baseX - 10, i;
        for (i = 0; i < placed.length; i++) if (Math.abs(placed[i] - o.y) < 12) ax -= 12;
        placed.push(o.y);
        out += '<text class="acc ' + cls + '" x="' + ax + '" y="' + (o.y + 5) + '">' + acc(o.a) + '</text>';
      }
    });
    return out;
  }
  function renderStaff() {
    var g = $("staffNotes");
    if (!g) return;
    var flat = cur ? cur.flat : false, shown = [], k;
    if (answer !== null) shown.push(answer);
    if (!locked) for (k in held) if (shown.indexOf(+k) < 0) shown.push(+k);
    var out = chord(shown, NX, function () { return verdict || ""; }, flat);
    if (revealed && cur) out += chord([cur.abs], GX, function () { return "ghost"; }, flat);
    g.innerHTML = out;
  }

  /* ---------- audio ---------- */
  var ac = null;
  function tone(midi, at, dur) {
    if (!sound) return;
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === "suspended") ac.resume();
    } catch (e) { return; }
    var t = ac.currentTime + at, f = 440 * Math.pow(2, (midi - 69) / 12);
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.16, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    var o1 = ac.createOscillator(), o2 = ac.createOscillator();
    o1.type = "triangle"; o1.frequency.value = f;
    o2.type = "sine"; o2.frequency.value = f * 2;
    var g2 = ac.createGain(); g2.gain.value = 0.25;
    o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(ac.destination);
    o1.start(t); o2.start(t); o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
  }

  /* ---------- prompts ---------- */
  function spellings() {
    var out = [];
    groups.forEach(function (g) { out = out.concat(GROUPS[g]); });
    return out.length ? out : GROUPS.nat;
  }
  var lastAbs = -1, lastPlayed = -1;

  function newPrompt() {
    var again = retry;
    retry = null;
    var note;
    if (again) {
      note = again;
    } else {
      var list = spellings(), octs = OCT_SETS[octaves], guard = 0;
      do {
        var s = list[Math.floor(Math.random() * list.length)];
        var oct = octs[Math.floor(Math.random() * octs.length)];
        note = { l: s.l, a: s.a, oct: oct, abs: absOf(s.l, s.a, oct) };
      } while (++guard < 24 && list.length * octs.length > 1 && note.abs === lastAbs);
    }
    lastAbs = note.abs;

    cur = { l: note.l, a: note.a, oct: note.oct, abs: note.abs, flat: note.a < 0, t0: performance.now() };
    locked = false; verdict = null; revealed = false; answer = null; lastPlayed = -1;
    held = {}; clearPace();

    $("counter").textContent = "Prompt " + (stats.asked + 1) + (again ? " · same one again" : "");
    $("askNote").innerHTML = labelHTML(cur) + (grade === "exact" ? "<span class=\"oct\">" + cur.oct + "</span>" : "");
    $("sub").textContent = grade === "exact"
      ? "Play it — one key, no thinking."
      : "Any octave — just find the key.";
    $("prompt").dataset.verdict = "none";
    $("verdict").textContent = ""; $("verdict").removeAttribute("data-v");
    $("hint").textContent = "";
    $("slot1").textContent = "·";
    paint();
  }

  function press(n) {
    if (n < 0 || n > 127) return;
    held[n] = true;
    if (locked) { paint(); return; }
    tone(n, 0, 0.5);
    answer = n; lastPlayed = n;
    $("slot1").textContent = midiName(n, cur.flat);
    judge(n);
  }
  function release(n) { delete held[n]; paint(); }

  function judge(n) {
    locked = true;
    var ok = grade === "exact"
      ? n === cur.abs
      : ((n % 12) + 12) % 12 === ((cur.abs % 12) + 12) % 12;
    var ms = performance.now() - cur.t0;

    stats.asked++;
    if (ok) {
      stats.right++; stats.streak++; stats.times.push(ms);
      if (stats.streak > stats.best) stats.best = stats.streak;
    } else { stats.streak = 0; }
    renderStats();

    verdict = ok ? "right" : "wrong";
    retry = ok ? null : { l: cur.l, a: cur.a, oct: cur.oct, abs: cur.abs };
    $("prompt").dataset.verdict = verdict;
    var v = $("verdict");
    v.dataset.v = verdict;
    v.textContent = ok
      ? "✓ " + (ms / 1000).toFixed(1) + "s"
      : "✗ that’s " + midiName(n, cur.flat);
    $("hint").textContent = ok ? "" : "Wanted " + label(cur) + cur.oct + " — same note comes back.";

    paint();
    if (!ok) tone(cur.abs, 0.45, 0.9);      // hear the one you were after
    startPace(ok);
  }

  /* ---------- pacing ---------- */
  function clearPace() {
    if (paceTimer) { clearInterval(paceTimer); paceTimer = null; }
    $("pace").hidden = true; $("count").hidden = true;
  }

  // A hit moves on almost at once; only a miss gets the dwell time you chose.
  function startPace(ok) {
    clearPace();
    var cEl = $("count");
    cEl.hidden = false;
    if (pace <= 0) { cEl.textContent = "space for the next prompt"; return; }
    var span = ok ? RIGHT_WAIT : pace;
    var bar = $("paceBar"), end = performance.now() + span;
    $("pace").hidden = false;
    function tick() {
      var left = end - performance.now();
      if (left <= 0) { clearPace(); newPrompt(); return; }
      bar.style.width = (100 * left / span) + "%";
      cEl.textContent = span >= 1000 ? "next in " + Math.ceil(left / 1000) + "s" : "next…";
    }
    tick();
    paceTimer = setInterval(tick, 50);
  }

  function renderStats() {
    $("sScore").textContent = stats.right + "/" + stats.asked;
    $("sStreak").textContent = stats.streak;
    $("sBest").textContent = stats.best;
    $("sAcc").textContent = stats.asked ? Math.round(100 * stats.right / stats.asked) + "%" : "—";
    if (stats.times.length) {
      var s = stats.times.slice().sort(function (a, b) { return a - b; });
      $("sTime").textContent = (s[Math.floor(s.length / 2)] / 1000).toFixed(1) + "s";
    } else { $("sTime").textContent = "—"; }
  }

  /* ---------- pointer input ---------- */
  kb.addEventListener("pointerdown", function (e) {
    var n = e.target.dataset && e.target.dataset.note;
    if (!n) return;
    e.target.setPointerCapture(e.pointerId); press(+n);
  });
  kb.addEventListener("pointerup", function (e) {
    var n = e.target.dataset && e.target.dataset.note; if (n) release(+n);
  });
  kb.addEventListener("pointercancel", function (e) {
    var n = e.target.dataset && e.target.dataset.note; if (n) release(+n);
  });

  /* ---------- Web MIDI ---------- */
  var access = null;
  function setStatus(state, text) {
    $("status").dataset.on = state; $("statusText").textContent = text;
  }
  function showNotice(html) { var n = $("notice"); n.innerHTML = html; n.hidden = false; }

  function onMessage(e) {
    var d = e.data, cmd = d[0] & 0xf0;
    if (cmd === 0x90 && d[2] > 0) press(d[1]);
    else if (cmd === 0x80 || (cmd === 0x90 && d[2] === 0)) release(d[1]);
  }
  function bind() {
    if (!access) return;
    access.inputs.forEach(function (i) { i.onmidimessage = null; });
    var want = $("device").value, any = false;
    access.inputs.forEach(function (i) {
      if (want === "all" || i.id === want) { i.onmidimessage = onMessage; any = true; }
    });
    setStatus(any ? "live" : "off", any ? "listening" : "no input");
  }
  function refresh() {
    var sel = $("device"), prev = sel.value, opts = [];
    access.inputs.forEach(function (i) { opts.push({ id: i.id, name: i.name || "MIDI input" }); });
    sel.innerHTML = "";
    if (!opts.length) {
      sel.innerHTML = "<option>No MIDI input found</option>";
      setStatus("off", "no device");
      return;
    }
    var all = document.createElement("option");
    all.value = "all"; all.textContent = "All inputs (" + opts.length + ")";
    sel.appendChild(all);
    opts.forEach(function (o) {
      var el = document.createElement("option");
      el.value = o.id; el.textContent = o.name; sel.appendChild(el);
    });
    sel.value = (prev && [].slice.call(sel.options).some(function (o) { return o.value === prev; })) ? prev : "all";
    bind();
  }
  $("device").addEventListener("change", bind);

  if (!navigator.requestMIDIAccess) {
    setStatus("off", "no web midi");
    showNotice("This browser has no Web MIDI. Chrome, Edge and Opera have it on desktop and Android; Safari and Firefox don’t. The on-screen keyboard below works everywhere.");
  } else {
    navigator.requestMIDIAccess({ sysex: false }).then(function (a) {
      access = a; a.onstatechange = refresh; refresh();
    }).catch(function (err) {
      setStatus("off", "midi blocked");
      showNotice("Web MIDI was blocked here (<code>" + (err && err.name ? err.name : "error") +
        "</code>). Sandboxed frames and plain <code>http://</code> addresses both block it — serve this file over <code>https</code>, or from <code>http://localhost</code>. The on-screen keyboard works either way.");
    });
  }

  /* ---------- settings ---------- */
  function group(containerId, key, get, set) {
    var els = $(containerId).querySelectorAll("[data-" + key + "]");
    function sync() {
      [].forEach.call(els, function (e) {
        e.setAttribute("aria-pressed", e.dataset[key] === get() ? "true" : "false");
      });
    }
    [].forEach.call(els, function (e) {
      e.addEventListener("click", function () { set(e.dataset[key]); sync(); retry = null; newPrompt(); });
    });
    sync();
  }
  group("gradeChips", "grade", function () { return grade; }, function (v) { grade = v; });
  group("paceChips", "pace", function () { return String(pace); }, function (v) { pace = parseInt(v, 10); });
  group("octChips", "oct", function () { return String(octaves); }, function (v) {
    octaves = parseInt(v, 10); lastAbs = -1; setRange();
  });

  var poolEls = $("poolChips").querySelectorAll("[data-group]");
  [].forEach.call(poolEls, function (e) {
    e.setAttribute("aria-pressed", groups.indexOf(e.dataset.group) >= 0 ? "true" : "false");
    e.addEventListener("click", function () {
      var on = e.getAttribute("aria-pressed") === "true";
      if (on && groups.length === 1) return;              // one group has to stay on
      if (on) groups.splice(groups.indexOf(e.dataset.group), 1); else groups.push(e.dataset.group);
      e.setAttribute("aria-pressed", on ? "false" : "true");
      retry = null; newPrompt();
    });
  });

  function toggle(id, get, set) {
    var b = $(id);
    b.setAttribute("aria-pressed", get() ? "true" : "false");
    b.addEventListener("click", function () { set(!get()); b.setAttribute("aria-pressed", get() ? "true" : "false"); });
  }
  toggle("soundChip", function () { return sound; }, function (v) { sound = v; });

  $("show").addEventListener("click", function () {
    if (!cur || revealed) return;
    revealed = true;
    $("hint").textContent = "Wanted " + label(cur) + cur.oct + ".";
    paint();
    tone(cur.abs, 0.02, 0.9);
  });
  $("skip").addEventListener("click", function () { retry = null; newPrompt(); });
  $("reset").addEventListener("click", function () {
    stats = { asked: 0, right: 0, streak: 0, best: 0, times: [] };
    retry = null; renderStats(); newPrompt();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === " " || e.key === "Enter") {
      if (e.target.tagName === "BUTTON" || e.target.tagName === "SELECT") return;
      e.preventDefault(); newPrompt();
    }
  });

  var fsBtn = $("fs"), docEl = document.documentElement;
  var goFs = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
  var endFs = document.exitFullscreen || document.webkitExitFullscreen;
  function fsOn() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function syncFs() {
    var on = fsOn();
    fsBtn.textContent = on ? "Exit fullscreen" : "Fullscreen";
    fsBtn.setAttribute("aria-pressed", on ? "true" : "false");
  }
  if (goFs) {
    fsBtn.hidden = false;
    fsBtn.addEventListener("click", function () {
      try { if (fsOn()) { endFs.call(document); } else { var r = goFs.call(docEl); if (r && r.catch) r.catch(function () {}); } }
      catch (e) { /* refused by the browser — leave the button as it was */ }
    });
    document.addEventListener("fullscreenchange", syncFs);
    document.addEventListener("webkitfullscreenchange", syncFs);
  }

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () {
      try {
        if (document.fonts.check('40px "Noto Music"', "𝄞")) return;
      } catch (e) { /* fall through to labels */ }
      $("clefs").innerHTML =
        '<text class="clef-label" x="26" y="48" transform="rotate(-90 26 48)">TREBLE</text>' +
        '<text class="clef-label" x="26" y="88" transform="rotate(-90 26 88)">BASS</text>';
    });
  }

  setRange();
  renderStats();
  newPrompt();
})();
</script>
